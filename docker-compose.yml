services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: agentos
      POSTGRES_USER: agentos
      POSTGRES_PASSWORD: agentos
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentos -d agentos"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  agentos-dev:
    image: python:3.11-slim
    working_dir: /workspace/agentos
    command: ["python", "-V"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/workspace/agentos
      - ./memory:/workspace/agentos/memory
      - ./artifacts:/workspace/agentos/artifacts
      - ./runs:/workspace/agentos/runs

volumes:
  pgdata:
