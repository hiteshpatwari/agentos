[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentos"
version = "0.1.0"
description = "AgentOS monorepo scaffold"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = [".", "packages/contracts/src", "apps/api/src", "apps/cli/src", "packages/memory/src", "packages/policy/src", "packages/executor/src", "packages/supervisor/src"]
testpaths = ["tests"]
addopts = "-q"
